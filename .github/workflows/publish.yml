name: Check SDK npm OIDC publishing

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Stage test packages without publishing them
        required: true
        type: boolean
        default: false
      package:
        description: Package to release
        required: true
        type: choice
        default: all
        options:
          - all
          - engine
          - vite

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require the SDK verification branch
        if: inputs.publish
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "bolotnikov/sdk" ] || [ "$REPOSITORY_PRIVATE" != "false" ] || [ "$RELEASE_REF" != "refs/heads/codex/verify-npm-oidc" ]; then
            echo "::error::Run staging only from the public SDK verification branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build engine
        run: npm run build --workspace @gamedevland/engine

      - name: Build Vite integration
        run: npm run build --workspace @gamedevland/vite

      - name: Typecheck workspace
        run: npm run typecheck

      - name: Validate architecture
        run: npm run lint

      - name: Test engine
        run: npm test --workspace @gamedevland/engine

      - name: Test pointer lifecycle
        run: npm run test:input-lifecycle

      - name: Test renderer contracts
        run: npm run test:renderers

      - name: Test embedded Three textures
        run: npm run test:three-texture

      - name: Test lifecycle stability
        run: npm run test:stability

      - name: Test archive dependencies
        run: npm run test:archive-dependency

      - name: Test Playgama integration
        run: npm run test:playgama

      - name: Inspect engine package
        run: npm pack --dry-run --workspace @gamedevland/engine

      - name: Test engine resource cleanup
        run: npm run test:resource-cleanup --workspace @gamedevland/engine

      - name: Test screen resolution
        run: npm run test:screen --workspace @gamedevland/engine

      - name: Test locale preferences and text fitting
        run: npm run test:locales

      - name: Test audio activation and single-instance music
        run: npm run test:audio

      - name: Test shared tooling
        run: npm test --workspace @gamedevland/vite

      - name: Test CrazyGames integration
        run: npm run test:crazygames

      - name: Verify packed blank project
        run: npm run test:project-template

      - name: Inspect Vite package
        run: npm pack --dry-run --workspace @gamedevland/vite

      - name: Stage engine through npm OIDC
        if: inputs.publish && (inputs.package == 'all' || inputs.package == 'engine')
        run: |
          version="$(node -p "require('./packages/engine/package.json').version")"
          npm version "${version}-oidc-test.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version --ignore-scripts --workspace @gamedevland/engine
          npm stage publish ./packages/engine --access public --tag oidc-check

      - name: Stage Vite integration through npm OIDC
        if: inputs.publish && (inputs.package == 'all' || inputs.package == 'vite')
        run: |
          version="$(node -p "require('./packages/vite/package.json').version")"
          npm version "${version}-oidc-test.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version --ignore-scripts --workspace @gamedevland/vite
          npm stage publish ./packages/vite --access public --tag oidc-check
